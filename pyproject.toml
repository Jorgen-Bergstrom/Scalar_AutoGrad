[project]
name = "scalar-autograd"
version = "0.1.0"
description = "A reverse-mode automatic differentiation engine in ~80 lines of Python"
requires-python = ">=3.12"

dependencies = [
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.8.0",
    "torch",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
